[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "market-ai-orchestrator"
version = "1.0.0"
description = "FastAPI AI Orchestrator & Delegated MCP Client for Market Intelligence Frontend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "mcp[cli]==2.3.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Nginx Reverse Proxy Configuration for Market Intelligence MCP Server
# Specifically disables buffering and sets long read timeouts for Streamable HTTP + SSE.

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream mcp_gateway {
        server mcp-server:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name mcp.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name mcp.example.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        client_max_body_size 4m;

        # MCP Streamable HTTP & SSE streaming endpoint
        location /mcp {
            proxy_pass http://mcp_gateway;
            proxy_http_version 1.1;

            # Critical for SSE / Streamable HTTP: disable all proxy buffering
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            gzip off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Accel-Buffering no;
        }

        # OAuth 2.1 Protected Resource Metadata (RFC 9728)
        location /.well-known/oauth-protected-resource {
            proxy_pass http://mcp_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health endpoints
        location /health/ {
            proxy_pass http://mcp_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
